<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#101018">
    <title>Карты таро</title>
    <link rel="stylesheet" href="/tarot/styles.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
<main class="tarot-shell" id="app">
    <section class="stage" id="stage">
        <header class="topbar">
            <div>
                <p class="eyebrow">Астария</p>
                <h1>Карты таро</h1>
            </div>
            <button class="icon-button" id="refreshButton" type="button" aria-label="Обновить">↻</button>
        </header>

        <section class="stats" aria-label="Статус гаданий">
            <article>
                <span>Гадания</span>
                <strong id="drawsCount">0</strong>
            </article>
            <article>
                <span>Король</span>
                <strong id="pityCount">0/50</strong>
            </article>
            <article>
                <span>Арканы</span>
                <strong id="collectionCount">0/22</strong>
            </article>
        </section>

        <nav class="tabs" aria-label="Разделы Таро">
            <button class="tab active" type="button" data-tab="draw">Гадание</button>
            <button class="tab" type="button" data-tab="history">Моя история</button>
            <button class="tab" type="button" data-tab="feed">Лента Судьбы</button>
        </nav>

        <section class="panel active" data-panel="draw">
            <div class="table-scene" aria-live="polite">
                <div class="cards" id="cards"></div>
                <div class="result" id="result" hidden></div>
            </div>
            <div class="actions">
                <button class="primary-button" id="startButton" type="button">Открыть карты</button>
                <button class="secondary-button" id="claimButton" type="button" hidden>Получить награду</button>
            </div>
            <div class="packages" id="packages"></div>
        </section>

        <section class="panel" data-panel="history">
            <div class="filters" id="historyFilters">
                <button class="chip active" type="button" data-rarity="">Все</button>
                <button class="chip" type="button" data-rarity="COMMON">Обычные</button>
                <button class="chip" type="button" data-rarity="RARE">Редкие</button>
                <button class="chip" type="button" data-rarity="ROYAL">Королевские</button>
            </div>
            <div class="list" id="historyList"></div>
        </section>

        <section class="panel" data-panel="feed">
            <div class="list" id="feedList"></div>
        </section>
    </section>

    <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
    <div class="confetti" id="confetti" aria-hidden="true"></div>
</main>
<script src="/tarot/app.js" defer></script>
</body>
</html>
