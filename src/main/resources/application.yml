spring:
  application:
    name: force-play-bot
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/forceplay}
    username: ${SPRING_DATASOURCE_USERNAME:forceplay}
    password: ${SPRING_DATASOURCE_PASSWORD:forceplay}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  flyway:
    enabled: true
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:}
  config:
    import:
      - optional:file:./messages.yml
      - optional:file:./servers.yml

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

logging:
  level:
    com.forceplay.bot: INFO

forceplay:
  bot:
    username: ${BOT_USERNAME:forceplay_bot}
    token: ${BOT_TOKEN:replace-me}
    channel-username: ${BOT_CHANNEL_USERNAME:@forceplay}
    admin-ids: ${ADMIN_IDS:}
    referral-enabled: ${REFERRAL_ENABLED:true}
    referral-item-id: ${REFERRAL_ITEM_ID:57}
    referral-item-count: ${REFERRAL_ITEM_COUNT:1}
    integration-mode: ${FORCEPLAY_INTEGRATION_MODE:mock}
    hwid-ttl-seconds: ${HWID_TTL_SECONDS:120}
    rate-limit-per-minute: ${RATE_LIMIT_PER_MINUTE:30}
    polling-enabled: ${BOT_POLLING_ENABLED:true}
